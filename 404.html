<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>markets</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#efe4ee">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/fav-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/img/fav-192.png">
<style>
@font-face{font-family:Inter;src:url(/assets/fonts/inter.woff2) format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:Inter;src:url(/assets/fonts/inter-italic.woff2) format('woff2');font-weight:100 900;font-style:italic;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;color:#241b45;background:#efe4ee;-webkit-font-smoothing:antialiased;overflow:hidden}
.bg{position:fixed;inset:0;background:url(/assets/img/city-poster.jpg) 50% 50%/cover no-repeat;filter:saturate(.9);transform:scale(1.06);animation:drift 40s ease-in-out infinite alternate}
@media (orientation:portrait){.bg{background-image:url(/assets/img/city-poster-m.jpg)}}
@keyframes drift{to{transform:scale(1.12) translate(-1.5%,1%)}}
.veil{position:fixed;inset:0;background:linear-gradient(180deg,rgba(240,232,246,.55),rgba(246,236,243,.35) 45%,rgba(247,240,245,.9))}
main{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.n{font-style:italic;font-weight:900;font-size:clamp(110px,22vw,260px);line-height:.85;letter-spacing:-.06em;padding-right:.08em;background:linear-gradient(180deg,#ffffff 30%,#efe6fb 72%,#e0d3f5);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 10px 30px rgba(70,34,104,.3));animation:in 1.2s cubic-bezier(.2,.8,.2,1) both}
h1{margin-top:18px;font-size:clamp(15px,1.6vw,20px);font-weight:750;letter-spacing:.28em;text-transform:uppercase;animation:in 1s .2s cubic-bezier(.2,.8,.2,1) both}
p{margin-top:12px;max-width:420px;color:#4a3f72;line-height:1.6;animation:in 1s .3s cubic-bezier(.2,.8,.2,1) both}
.b{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:30px;animation:in 1s .4s cubic-bezier(.2,.8,.2,1) both}
.b a{display:inline-flex;align-items:center;gap:10px;padding:15px 28px;border:1px solid rgba(107,74,158,.75);background:rgba(255,255,255,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#6b4a9e;font-size:13px;font-weight:750;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;transition:background .3s,letter-spacing .4s}
.b a:hover{background:rgba(255,255,255,.92);letter-spacing:.26em}
.b a.p{background:linear-gradient(90deg,#6b4a9e,#c25b8e 60%,#e98d6e);color:#fff;border-color:transparent}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div><div class="veil" aria-hidden="true"></div>
<main>
  <div class="n" aria-hidden="true">404</div>
  <h1>This street isn't on the map</h1>
  <p>The page you were looking for isn't in the city. The market is still open.</p>
  <div class="b"><a class="p" href="/">Back to the city</a><a href="/app">Open the terminal</a></div>
</main>
</body>
</html>
