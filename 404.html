<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bukz</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#a667cb">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/fav-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/img/fav-192.png">
<style>
@font-face{font-family:Unbounded;src:url(/assets/fonts/unbounded.woff2) format('woff2');font-weight:200 900;font-display:swap}
@font-face{font-family:Inter;src:url(/assets/fonts/inter.woff2) format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;color:#1c1a3a;background:#f7f2e9;-webkit-font-smoothing:antialiased;overflow:hidden}
.bg{position:fixed;inset:0;background:url(/assets/img/city-poster.jpg) 50% 50%/cover no-repeat;transform:scale(1.06);animation:drift 40s ease-in-out infinite alternate}
@media (orientation:portrait){.bg{background-image:url(/assets/img/city-poster-m.jpg)}}
@keyframes drift{to{transform:scale(1.12) translate(-1.5%,1%)}}
.veil{position:fixed;inset:0;background:linear-gradient(180deg,rgba(42,20,112,.06),rgba(42,20,112,.22) 55%,rgba(42,20,112,.6))}
main{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:#fffaf0}
.n{font-family:Unbounded,Inter,sans-serif;font-weight:900;font-size:clamp(110px,22vw,260px);line-height:.85;letter-spacing:-.05em;color:#fffaf0;text-shadow:.05em .05em 0 #2a1470;font-feature-settings:normal;animation:in 1.2s cubic-bezier(.2,.8,.2,1) both}
h1{margin-top:22px;font-family:Unbounded,Inter,sans-serif;font-size:clamp(16px,1.8vw,22px);font-weight:800;letter-spacing:-.01em;text-shadow:.06em .06em 0 #2a1470;font-feature-settings:normal;animation:in 1s .2s cubic-bezier(.2,.8,.2,1) both}
p{margin-top:12px;max-width:420px;color:#fff3df;line-height:1.6;text-shadow:0 1px 12px rgba(28,26,58,.6);animation:in 1s .3s cubic-bezier(.2,.8,.2,1) both}
.b{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:30px;animation:in 1s .4s cubic-bezier(.2,.8,.2,1) both}
.b a{display:inline-flex;align-items:center;height:52px;padding:0 24px;border-radius:999px;font-weight:800;font-size:14.5px;text-decoration:none;transition:transform .3s,box-shadow .3s}
.b a.p{background:#fff8e8;color:#2a1470;box-shadow:0 5px 0 #2a1470}
.b a.p:hover{transform:translateY(-2px);box-shadow:0 7px 0 #2a1470}
.b a.s{color:#fffaf0;border:1.5px solid rgba(255,250,240,.75);background:rgba(255,250,240,.14)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div><div class="veil" aria-hidden="true"></div>
<main>
  <div class="n" aria-hidden="true">404</div>
  <h1>This street isn't on the map</h1>
  <p>The page you were looking for isn't in the city. The market is still open.</p>
  <div class="b"><a class="p" href="/">Back to the city</a><a class="s" href="/app">Open the terminal</a></div>
</main>
</body>
</html>
